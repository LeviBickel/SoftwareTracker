<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favicon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#favicon-gradient)"/>

  <!-- License document icon -->
  <rect x="8" y="6" width="16" height="20" rx="2" fill="white" opacity="0.95"/>

  <!-- Key symbol -->
  <g transform="translate(10, 9)" fill="url(#favicon-gradient)">
    <circle cx="3" cy="3" r="2.5"/>
    <rect x="3" y="2" width="8" height="2" rx="1"/>
    <rect x="9" y="1" width="1" height="1.5"/>
    <rect x="10.5" y="1" width="1" height="1.5"/>
  </g>

  <!-- Lines representing text -->
  <rect x="10" y="16" width="12" height="1.5" rx="0.5" fill="url(#favicon-gradient)" opacity="0.4"/>
  <rect x="10" y="19" width="10" height="1.5" rx="0.5" fill="url(#favicon-gradient)" opacity="0.4"/>

  <!-- Checkmark -->
  <path d="M 13 22 L 14 23 L 17 20" stroke="url(#favicon-gradient)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
