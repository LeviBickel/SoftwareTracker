<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#brandGradient)"/>

  <!-- Document/License icon -->
  <g transform="translate(50, 40)">
    <!-- Main document shape -->
    <rect x="10" y="0" width="80" height="110" rx="6" fill="white" opacity="0.95"/>

    <!-- License key icon (key shape) -->
    <g transform="translate(25, 20)" fill="url(#brandGradient)">
      <circle cx="8" cy="8" r="8"/>
      <rect x="8" y="5" width="35" height="6" rx="2"/>
      <rect x="33" y="2" width="3" height="5"/>
      <rect x="38" y="2" width="3" height="5"/>
    </g>

    <!-- License text lines -->
    <rect x="20" y="50" width="60" height="4" rx="2" fill="url(#lightGradient)" opacity="0.6"/>
    <rect x="20" y="60" width="50" height="4" rx="2" fill="url(#lightGradient)" opacity="0.5"/>
    <rect x="20" y="70" width="55" height="4" rx="2" fill="url(#lightGradient)" opacity="0.5"/>

    <!-- Checkmark/approval icon -->
    <g transform="translate(20, 85)" fill="url(#brandGradient)">
      <circle cx="30" cy="8" r="12" opacity="0.2"/>
      <path d="M 27 8 L 29 10 L 34 5" stroke="url(#brandGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sparkle/highlight effects -->
  <circle cx="170" cy="50" r="3" fill="white" opacity="0.8"/>
  <circle cx="160" cy="35" r="2" fill="white" opacity="0.6"/>
  <circle cx="30" cy="160" r="2.5" fill="white" opacity="0.7"/>
</svg>
